
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sanskrit - Quiz Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7fc;color:#17233c}
header{background:white;padding:17px;display:flex;align-items:center;gap:15px;box-shadow:0 2px 10px #0001}

.logo{font-size:21px;font-weight:bold;color:#1769e0}

main{max-width:650px;margin:auto;padding:22px 15px}

.hero h2{font-size:24px;margin-bottom:8px}
.hero p{font-size:13px}

</div>
